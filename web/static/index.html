<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Docs</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <strong class="brand">Travel Docs</strong>
  <div id="auth-area"></div>
</header>
<div class="app">
  <aside>
    <nav class="tabs">
      <button type="button" data-tab="routes" class="active">Routes</button>
      <button type="button" data-tab="collections">Collections</button>
    </nav>

    <div id="routes-panel" class="panel">
      <section id="upload-section" hidden>
        <form id="upload-form">
          <div class="row"><input type="file" name="file" accept=".gpx,application/gpx+xml" required></div>
          <div class="row">
            <input type="text" name="name" placeholder="Name (optional)" maxlength="200">
            <select name="visibility" title="Visibility">
              <option value="private">Private</option>
              <option value="public">Public</option>
            </select>
            <button class="primary" type="submit">Upload</button>
          </div>
          <div class="msg" data-msg></div>
        </form>
      </section>
      <section>
        <form id="filter-form">
          <div class="row">
            <select name="scope" id="scope-select"></select>
            <input type="search" name="name" placeholder="Name contains…">
          </div>
          <div class="row">
            <input type="number" name="min_km" placeholder="Min km" min="0" step="any">
            <input type="number" name="max_km" placeholder="Max km" min="0" step="any">
            <select name="sort">
              <option value="created_at:desc">Newest</option>
              <option value="updated_at:desc">Recently edited</option>
              <option value="distance:desc">Longest</option>
              <option value="distance:asc">Shortest</option>
              <option value="ascent:desc">Most ascent</option>
              <option value="name:asc">Name A–Z</option>
            </select>
          </div>
          <div class="row">
            <label class="check"><input type="checkbox" name="in_view"> Only in map view</label>
            <button type="submit">Apply</button>
          </div>
        </form>
      </section>
      <ul id="route-list" class="list"></ul>
      <div class="pager" id="route-pager"></div>
    </div>

    <div id="collections-panel" class="panel" hidden>
      <section id="collection-head"></section>
      <ul id="collection-list" class="list"></ul>
      <div class="pager" id="collection-pager"></div>
    </div>
  </aside>

  <main>
    <div id="map"></div>
    <div id="details" hidden>
      <div class="details-head">
        <div>
          <h2 id="d-name"></h2>
          <div class="meta" id="d-meta"></div>
        </div>
        <div class="actions" id="d-actions"></div>
      </div>
      <p class="description" id="d-description"></p>
      <div class="stats" id="d-stats"></div>
      <svg id="chart" preserveAspectRatio="none" role="img" aria-label="Elevation profile"></svg>
    </div>
  </main>
</div>

<dialog id="dialog">
  <div class="dialog-head">
    <h3 id="dialog-title"></h3>
    <button type="button" class="icon" id="dialog-close" aria-label="Close">×</button>
  </div>
  <div id="dialog-body"></div>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
