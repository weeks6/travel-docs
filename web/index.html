<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Docs — Routes</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7280;
    --border: #e3e6eb; --accent: #2563eb; --danger: #dc2626; --sel: #eef3ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: var(--text); background: var(--bg); }
  .app { display: grid; grid-template-columns: 360px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  h1 { font-size: 16px; margin: 0 0 8px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  input, select, button { font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
  input[type=file] { width: 100%; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 6px; margin-bottom: 6px; }
  .row > * { flex: 1; min-width: 0; }
  .msg { min-height: 18px; font-size: 13px; }
  .msg.error { color: var(--danger); }
  ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  li { padding: 10px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  li:hover { background: var(--bg); }
  li.selected { background: var(--sel); }
  li .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .meta { color: var(--muted); font-size: 12px; }
  .pager { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; border-top: 1px solid var(--border); }
  main { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  #map { min-height: 300px; }
  #details { background: var(--panel); border-top: 1px solid var(--border); padding: 12px 16px; }
  #details[hidden] { display: none; }
  .details-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .details-head h2 { color: var(--text); text-transform: none; letter-spacing: 0; font-size: 16px; margin: 0; }
  .stats { display: flex; flex-wrap: wrap; gap: 20px; margin: 8px 0; }
  .stat .v { font-size: 18px; font-weight: 600; }
  .stat .l { color: var(--muted); font-size: 12px; }
  #chart { width: 100%; height: 140px; display: block; }
  #chart .area { fill: rgba(37, 99, 235, .15); }
  #chart .line { fill: none; stroke: var(--accent); stroke-width: 1.5; }
  #chart text { fill: var(--muted); font-size: 11px; }
  #chart .grid { stroke: var(--border); }
  .empty { padding: 16px; color: var(--muted); }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; height: auto; }
    aside { max-height: 60vh; }
    #map { height: 50vh; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <section>
      <h1>Routes</h1>
      <form id="upload-form">
        <div class="row"><input type="file" name="file" accept=".gpx,application/gpx+xml" required></div>
        <div class="row">
          <input type="text" name="name" placeholder="Name (optional)" maxlength="200">
          <button class="primary" type="submit">Upload</button>
        </div>
        <div id="upload-msg" class="msg"></div>
      </form>
    </section>
    <section>
      <h2>Filter</h2>
      <form id="filter-form">
        <div class="row"><input type="search" name="name" placeholder="Name contains…"></div>
        <div class="row">
          <input type="number" name="min_km" placeholder="Min km" min="0" step="any">
          <input type="number" name="max_km" placeholder="Max km" min="0" step="any">
        </div>
        <div class="row">
          <select name="sort">
            <option value="created_at:desc">Newest first</option>
            <option value="created_at:asc">Oldest first</option>
            <option value="distance:desc">Longest first</option>
            <option value="distance:asc">Shortest first</option>
            <option value="ascent:desc">Most ascent</option>
            <option value="name:asc">Name A–Z</option>
          </select>
          <button type="submit">Apply</button>
        </div>
        <label><input type="checkbox" name="in_view"> Only routes in map view</label>
      </form>
    </section>
    <ul id="list"></ul>
    <div class="pager">
      <button id="prev" type="button">‹ Prev</button>
      <span id="page-info"></span>
      <button id="next" type="button">Next ›</button>
    </div>
  </aside>
  <main>
    <div id="map"></div>
    <div id="details" hidden>
      <div class="details-head">
        <h2 id="d-name"></h2>
        <button id="delete" class="danger" type="button">Delete</button>
      </div>
      <div class="stats" id="d-stats"></div>
      <svg id="chart" preserveAspectRatio="none"></svg>
    </div>
  </main>
</div>
<script>
const state = { page: 1, totalPages: 0, selected: null, layer: null };
const $ = (s) => document.querySelector(s);

const map = L.map('map').setView([46, 8], 4);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors',
}).addTo(map);

const km = (m) => (m / 1000).toFixed(m < 10000 ? 2 : 1) + ' km';
const meters = (m) => (m == null ? '—' : Math.round(m) + ' m');

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (res.status === 204) return null;
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

function listQuery() {
  const f = new FormData($('#filter-form'));
  const q = new URLSearchParams({ page: state.page, page_size: 20 });
  const [sort, order] = f.get('sort').split(':');
  q.set('sort', sort); q.set('order', order);
  if (f.get('name')) q.set('name', f.get('name'));
  if (f.get('min_km')) q.set('min_distance_m', f.get('min_km') * 1000);
  if (f.get('max_km')) q.set('max_distance_m', f.get('max_km') * 1000);
  if (f.get('in_view')) {
    const b = map.getBounds();
    const clamp = (v, lim) => Math.max(-lim, Math.min(lim, v));
    q.set('bbox', [clamp(b.getWest(), 180), clamp(b.getSouth(), 90), clamp(b.getEast(), 180), clamp(b.getNorth(), 90)].join(','));
  }
  return q;
}

async function loadList() {
  const list = $('#list');
  try {
    const res = await api('/routes?' + listQuery());
    state.totalPages = res.total_pages;
    if (res.page > 1 && res.items.length === 0) { state.page = res.total_pages || 1; return loadList(); }
    list.replaceChildren();
    if (res.items.length === 0) {
      const li = document.createElement('div');
      li.className = 'empty'; li.textContent = 'No routes yet. Upload a GPX file.';
      list.append(li);
    }
    for (const r of res.items) {
      const li = document.createElement('li');
      li.dataset.id = r.id;
      if (r.id === state.selected?.id) li.classList.add('selected');
      const name = document.createElement('div'); name.className = 'name'; name.textContent = r.name;
      const meta = document.createElement('div'); meta.className = 'meta';
      meta.textContent = `${km(r.distance_m)} · ↑ ${meters(r.ascent_m)} · ${new Date(r.started_at || r.created_at).toLocaleDateString()}`;
      li.append(name, meta);
      li.onclick = () => select(r);
      list.append(li);
    }
    $('#page-info').textContent = `Page ${res.page} of ${Math.max(1, res.total_pages)} · ${res.total} total`;
    $('#prev').disabled = res.page <= 1;
    $('#next').disabled = res.page >= res.total_pages;
  } catch (e) {
    list.replaceChildren(Object.assign(document.createElement('div'), { className: 'empty', textContent: 'Error: ' + e.message }));
  }
}

async function select(route) {
  state.selected = route;
  document.querySelectorAll('#list li').forEach((li) => li.classList.toggle('selected', li.dataset.id === route.id));
  const [feature, elevation] = await Promise.all([
    api(`/routes/${route.id}/geometry`),
    api(`/routes/${route.id}/elevation`),
  ]);
  if (state.layer) state.layer.remove();
  state.layer = L.geoJSON(feature, { style: { color: '#2563eb', weight: 4 } }).addTo(map);
  map.fitBounds(state.layer.getBounds(), { padding: [24, 24] });

  $('#details').hidden = false;
  $('#d-name').textContent = route.name;
  const stats = [
    ['Distance', km(route.distance_m)],
    ['Ascent', meters(route.ascent_m)],
    ['Descent', meters(route.descent_m)],
    ['Min elevation', meters(route.min_elevation_m)],
    ['Max elevation', meters(route.max_elevation_m)],
    ['Points', route.point_count],
  ];
  $('#d-stats').replaceChildren(...stats.map(([l, v]) => {
    const d = document.createElement('div'); d.className = 'stat';
    d.innerHTML = '<div class="v"></div><div class="l"></div>';
    d.firstChild.textContent = v; d.lastChild.textContent = l;
    return d;
  }));
  drawChart(elevation.points);
  map.invalidateSize();
}

function drawChart(points) {
  const svg = $('#chart');
  const W = svg.clientWidth || 600, H = 140, P = { l: 44, r: 8, t: 8, b: 20 };
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  if (!points.length) {
    svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle">No elevation data in this file</text>`;
    return;
  }
  const maxD = points[points.length - 1].distance_m || 1;
  let minE = Math.min(...points.map((p) => p.elevation_m));
  let maxE = Math.max(...points.map((p) => p.elevation_m));
  if (maxE - minE < 10) { minE -= 5; maxE += 5; }
  const x = (d) => P.l + (d / maxD) * (W - P.l - P.r);
  const y = (e) => P.t + (1 - (e - minE) / (maxE - minE)) * (H - P.t - P.b);
  const line = points.map((p, i) => `${i ? 'L' : 'M'}${x(p.distance_m).toFixed(1)},${y(p.elevation_m).toFixed(1)}`).join('');
  const area = `${line}L${x(maxD)},${H - P.b}L${x(0)},${H - P.b}Z`;
  svg.innerHTML = `
    <line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${y(maxE)}" y2="${y(maxE)}"/>
    <line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${y(minE)}" y2="${y(minE)}"/>
    <text x="${P.l - 4}" y="${y(maxE) + 4}" text-anchor="end">${Math.round(maxE)} m</text>
    <text x="${P.l - 4}" y="${y(minE) + 4}" text-anchor="end">${Math.round(minE)} m</text>
    <text x="${P.l}" y="${H - 4}">0</text>
    <text x="${W - P.r}" y="${H - 4}" text-anchor="end">${km(maxD)}</text>
    <path class="area" d="${area}"/><path class="line" d="${line}"/>`;
}

$('#upload-form').onsubmit = async (e) => {
  e.preventDefault();
  const form = e.target, msg = $('#upload-msg');
  const btn = form.querySelector('button');
  btn.disabled = true; msg.className = 'msg'; msg.textContent = 'Uploading…';
  try {
    const route = await api('/routes', { method: 'POST', body: new FormData(form) });
    msg.textContent = `Uploaded “${route.name}” (${km(route.distance_m)})`;
    form.reset();
    state.page = 1;
    await loadList();
    await select(route);
  } catch (err) {
    msg.className = 'msg error'; msg.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
};

$('#delete').onclick = async () => {
  const r = state.selected;
  if (!r || !confirm(`Delete “${r.name}”?`)) return;
  try {
    await api(`/routes/${r.id}`, { method: 'DELETE' });
    state.selected = null;
    if (state.layer) { state.layer.remove(); state.layer = null; }
    $('#details').hidden = true;
    loadList();
  } catch (err) {
    alert('Delete failed: ' + err.message);
  }
};

$('#filter-form').onsubmit = (e) => { e.preventDefault(); state.page = 1; loadList(); };
$('#prev').onclick = () => { state.page--; loadList(); };
$('#next').onclick = () => { state.page++; loadList(); };
map.on('moveend', () => { if ($('#filter-form').in_view.checked) { state.page = 1; loadList(); } });

loadList();
</script>
</body>
</html>
